[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psp0"
version = "0.0.1.dev0"
description = "Post-Quantum Private Spend Primitive — research implementation"
requires-python = ">=3.11"
license = { text = "Research only — not for production" }
dependencies = [
    "numpy>=1.26",
    "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "rich>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

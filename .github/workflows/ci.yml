name: Functional checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      PSP_NULLIFIER_LIBRARY: ${{ github.workspace }}/native/build/libpsp_nullifier.so
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev binutils

      - name: Build and test native nullifier
        run: make -C native test
      - name: Run native checks under ASan and UBSan
        run: make -C native sanitize-test

      - name: Compile preliminary timing probe (do not run in shared CI)
        run: make -C native timing-probe-build
      - name: Compile namespace-bound V2 timing screen (do not run in shared CI)
        run: make -C native timing-v2-probe-build
      - name: Compile namespace-bound V2 commitment timing screen (do not run in shared CI)
        run: make -C native timing-commitment-v2-probe-build

      - name: Capture optimized wrapper disassembly
        run: make -C native audit

      - name: Syntax-check optional cleansing disassembly diagnostic
        run: bash -n scripts/audit_disasm_bzero.sh

      - name: Advisory native cleansing call-site check
        continue-on-error: true
        run: bash scripts/audit_disasm_bzero.sh native/build/libpsp_nullifier.so

      - name: Upload wrapper disassembly for review
        uses: actions/upload-artifact@v7
        with:
          name: nullifier-native-disassembly
          path: native/build/nullifier_native.disasm.txt

      - name: Run functional nullifier smoke tests
        run: python scripts/verify_nullifier_relation.py

      - name: Run numeric consistency diagnostics
        run: python scripts/security_budget_evaluator.py

      - name: Run Phase 1 arithmetic consistency audit
        run: python scripts/audit_phase1_claims.py

      - name: Run unit and property tests
        run: python -m pytest tests/ -q

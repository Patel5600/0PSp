name: Functional checks

on:
  push:
    branches: [main, chp4.24-aurora-ci-retry]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      PSP_NULLIFIER_LIBRARY: ${{ github.workspace }}/native/build/libpsp_nullifier.so
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev binutils

      - name: Build and test native nullifier
        run: make -C native test
      - name: Run native checks under ASan and UBSan
        run: make -C native sanitize-test

      - name: Compile preliminary timing probe (do not run in shared CI)
        run: make -C native timing-probe-build
      - name: Compile namespace-bound V2 timing screen (do not run in shared CI)
        run: make -C native timing-v2-probe-build
      - name: Compile namespace-bound V2 commitment timing screen (do not run in shared CI)
        run: make -C native timing-commitment-v2-probe-build

      - name: Capture optimized wrapper disassembly
        run: make -C native audit

      - name: Syntax-check optional cleansing disassembly diagnostic
        run: bash -n scripts/audit_disasm_bzero.sh

      - name: Advisory native cleansing call-site check
        continue-on-error: true
        run: bash scripts/audit_disasm_bzero.sh native/build/libpsp_nullifier.so

      - name: Upload wrapper disassembly for review
        uses: actions/upload-artifact@v4
        with:
          name: nullifier-native-disassembly
          path: native/build/nullifier_native.disasm.txt

      - name: Run functional nullifier smoke tests
        run: python scripts/verify_nullifier_relation.py

      - name: Run numeric consistency diagnostics
        run: python scripts/security_budget_evaluator.py

      - name: Run Phase 1 arithmetic consistency audit
        run: python scripts/audit_phase1_claims.py

      - name: Run unit and property tests
        run: python -m pytest tests/ -q

  aurora-upstream-candidate:
    if: ${{ (github.event_name == 'pull_request' && startsWith(github.head_ref, 'chp4.24-aurora')) || (github.event_name == 'push' && github.ref_name == 'chp4.24-aurora-ci-retry') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out exact upstream source and recursive submodules
        uses: actions/checkout@v4
        with:
          repository: scipr-lab/libiop
          ref: a2ed2ec2f3e85f29b6035951553b02cb737c817a
          path: vendor/libiop-audit
          submodules: recursive
          persist-credentials: false

      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libgmp-dev libprocps-dev libboost-all-dev libssl-dev libsodium-dev

      - name: Record source identity and build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          {
            echo "Expected upstream revision: a2ed2ec2f3e85f29b6035951553b02cb737c817a"
            echo "Actual upstream revision:"
            git -C vendor/libiop-audit rev-parse HEAD
            echo "Recursive submodule state:"
            git -C vendor/libiop-audit submodule status --recursive
            echo "CMake:"
            cmake --version
            echo "C++ compiler:"
            c++ --version
            echo "Host:"
            uname -a
          } 2>&1 | tee audit-results/environment.txt

      - name: Apply isolated one-line compile compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          file=vendor/libiop-audit/libiop/algebra/utils.hpp
          mkdir -p audit-results
          sha256sum "$file" | tee audit-results/utils-header-before.sha256
          if grep -q '^#include <cstddef>        shell: bash
        run: |
          set -euo pipefail
          cmake -S vendor/libiop-audit -B vendor/libiop-audit/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee audit-results/configure.log

      - name: Build Aurora and transcript serialization targets
        shell: bash
        run: |
          set -euo pipefail
          cmake --build vendor/libiop-audit/build --parallel 2 --target test_aurora_snark test_aurora_protocol test_serialization 2>&1 | tee audit-results/build.log

      - name: Run focused Aurora and serialization tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir vendor/libiop-audit/build --output-on-failure --timeout 1800 -R '^(test_aurora_snark|test_aurora_protocol|test_serialization)$' 2>&1 | tee audit-results/ctest.log

      - name: Upload immutable source, build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chp4-aurora-source-audit
          path: |
            audit-results/
            vendor/libiop-audit/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
 "$file"; then
            echo "Expected upstream include gap was not present; refusing to patch unexpectedly." >&2
            exit 1
          fi
          grep -q '^#define LIBIOP_ALGEBRA_UTILS_HPP_        shell: bash
        run: |
          set -euo pipefail
          cmake -S vendor/libiop-audit -B vendor/libiop-audit/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee audit-results/configure.log

      - name: Build Aurora and transcript serialization targets
        shell: bash
        run: |
          set -euo pipefail
          cmake --build vendor/libiop-audit/build --parallel 2 --target test_aurora_snark test_aurora_protocol test_serialization 2>&1 | tee audit-results/build.log

      - name: Run focused Aurora and serialization tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir vendor/libiop-audit/build --output-on-failure --timeout 1800 -R '^(test_aurora_snark|test_aurora_protocol|test_serialization)$' 2>&1 | tee audit-results/ctest.log

      - name: Upload immutable source, build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chp4-aurora-source-audit
          path: |
            audit-results/
            vendor/libiop-audit/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
 "$file"
          sed -i '/^#define LIBIOP_ALGEBRA_UTILS_HPP_$/a #include <cstddef>' "$file"
          sha256sum "$file" | tee audit-results/utils-header-after.sha256
          git -C vendor/libiop-audit diff --check
          git -C vendor/libiop-audit diff -- libiop/algebra/utils.hpp | tee audit-results/compatibility-overlay.diff
          echo "DIAGNOSTIC ONLY: pristine pinned build failed without this one-line include overlay; no upstream commit was changed."
      - name: Configure pinned source with upstream defaults
        shell: bash
        run: |
          set -euo pipefail
          cmake -S vendor/libiop-audit -B vendor/libiop-audit/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee audit-results/configure.log

      - name: Build Aurora and transcript serialization targets
        shell: bash
        run: |
          set -euo pipefail
          cmake --build vendor/libiop-audit/build --parallel 2 --target test_aurora_snark test_aurora_protocol test_serialization 2>&1 | tee audit-results/build.log

      - name: Run focused Aurora and serialization tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir vendor/libiop-audit/build --output-on-failure --timeout 1800 -R '^(test_aurora_snark|test_aurora_protocol|test_serialization)$' 2>&1 | tee audit-results/ctest.log

      - name: Upload immutable source, build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chp4-aurora-source-audit
          path: |
            audit-results/
            vendor/libiop-audit/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

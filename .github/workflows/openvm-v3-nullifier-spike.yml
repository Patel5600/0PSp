name: OpenVM Production-1 spend verification

on:
  pull_request:
    paths:
      - "proof/openvm/v3-nullifier-spike/**"
      - ".github/workflows/openvm-v3-nullifier-spike.yml"
  push:
    branches: [main]
    paths:
      - "proof/openvm/v3-nullifier-spike/**"
      - ".github/workflows/openvm-v3-nullifier-spike.yml"

permissions:
  contents: read

concurrency:
  group: openvm-v3-nullifier-spike-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  host-tests-and-guest-build:
    name: Production-1 relation and verifier checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: proof/openvm/v3-nullifier-spike
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install RISC-V build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-riscv64-unknown-elf
          test "$(riscv64-unknown-elf-gcc -dumpfullversion)" = "15.3.0"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component rust-src

      - name: Run host-side KAT and adversarial tests
        run: cargo +1.91.1 test --locked

      - name: Install checksum-verified cargo-openvm v2.0.2 release binary
        env:
          CARGO_OPENVM_SHA256: c2a1d63a96c093a4969c799f3021fb991b0c51f56b53f26e3468d2d13676de2f
        run: |
          archive="$RUNNER_TEMP/cargo-openvm-v2.0.2-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/openvm-org/openvm/releases/download/v2.0.2/cargo-openvm-v2.0.2-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "$CARGO_OPENVM_SHA256  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/cargo-openvm-unpacked" "$HOME/.cargo/bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/cargo-openvm-unpacked"
          binary="$(find "$RUNNER_TEMP/cargo-openvm-unpacked" -type f -name cargo-openvm -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" "$HOME/.cargo/bin/cargo-openvm"
          cargo +1.91.1 openvm --help > /dev/null

      - name: Build V3 nullifier spike guest for OpenVM
        run: |
          cargo +1.91.1 openvm build
          elf="$(find target/riscv32im-risc0-zkvm-elf/release -maxdepth 1 -type f -executable -print -quit)"
          test -n "$elf"
          test -s "$elf"
          printf '%s\n' "$elf" > "$RUNNER_TEMP/v3-nullifier-guest-elf.path"
          echo "V3_SPIKE_GUEST_ELF_PATH=$elf"

      - name: Generate deterministic witness fixtures and assert public digest KAT
        run: |
          fixture_dir="$RUNNER_TEMP/v3-nullifier-witnesses"
          python3 scripts/make_witnesses.py "$fixture_dir"
          test "$(cat "$fixture_dir/expected-public-digest.txt")" = "82ec02fc6689a4c56038463a780a9d3e75d5075043645cdb754a4d9c73b21df665303861e54f2a07876f811f1fdb38f353f1572367db5fb4a36f27672983b5ee"
          test "$(cat "$fixture_dir/expected-spend-public-digest.txt")" = "aa7b029542a3d75bc6dee7d9927b9efa10e5fc45a5ff1eb19745ec9357733e32cd4974e83b050bbbd14a2c36c141bfee99e833d7030ce1657c3a727039c53f0f"

      - name: Test proof checker and build the custom 64-byte OpenVM SDK runner
        run: |
          cargo +1.91.1 test --locked --manifest-path proof-output-checker/Cargo.toml
          cargo +1.91.1 build --locked --release --manifest-path proof-output-checker/Cargo.toml
          test -x proof-output-checker/target/release/psp-openvm-v3-proof-output-checker
          test -x proof-output-checker/target/release/openvm-v3-sdk-runner
          echo "V3_SPIKE_PROOF_CHECKER_CARGO_LOCK_BEGIN"
          cat proof-output-checker/Cargo.lock
          echo "V3_SPIKE_PROOF_CHECKER_CARGO_LOCK_END"

      - name: Execute valid and adversarial nullifier fixtures in OpenVM SDK memory profile
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/v3-nullifier-witnesses"
          runner="proof-output-checker/target/release/openvm-v3-sdk-runner"
          elf="$(cat "$RUNNER_TEMP/v3-nullifier-guest-elf.path")"
          if ! "$runner" run openvm.toml "$elf" "$fixture_dir/valid.witness" > "$fixture_dir/valid-run.log" 2>&1; then
            echo "OpenVM SDK rejected the known-valid fixture; full guest-run output follows:"
            cat "$fixture_dir/valid-run.log"
            exit 1
          fi
          python3 scripts/check_public_output.py "$fixture_dir/valid-run.log" "$fixture_dir/expected-public-digest.txt"
          for fixture in wrong-key changed-value changed-salt wrong-nullifier bad-bundle trailing-data; do
            if "$runner" run openvm.toml "$elf" "$fixture_dir/$fixture.witness" > "$fixture_dir/$fixture-run.log" 2>&1; then
              echo "OpenVM unexpectedly accepted adversarial fixture: $fixture"
              cat "$fixture_dir/$fixture-run.log"
              exit 1
            fi
            grep -q "OpenVM rejected witness" "$fixture_dir/$fixture-run.log"
            echo "OpenVM rejected adversarial fixture: $fixture"
          done

      - name: Execute full one-input/one-output spend fixtures in OpenVM SDK memory profile
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/v3-nullifier-witnesses"
          runner="proof-output-checker/target/release/openvm-v3-sdk-runner"
          elf="$(cat "$RUNNER_TEMP/v3-nullifier-guest-elf.path")"
          if ! "$runner" run openvm.toml "$elf" "$fixture_dir/spend-valid.witness" > "$fixture_dir/spend-valid-run.log" 2>&1; then
            echo "OpenVM SDK rejected the valid one-input/one-output spend fixture; full output follows:"
            cat "$fixture_dir/spend-valid-run.log"
            exit 1
          fi
          python3 scripts/check_public_output.py "$fixture_dir/spend-valid-run.log" "$fixture_dir/expected-spend-public-digest.txt"
          for fixture in spend-wrong-key spend-changed-value spend-changed-salt spend-wrong-nullifier spend-bad-bundle spend-trailing-data spend-bad-root spend-bad-path spend-changed-output-entropy spend-changed-state-head spend-changed-state-context spend-unknown-policy spend-value-conservation; do
            if "$runner" run openvm.toml "$elf" "$fixture_dir/$fixture.witness" > "$fixture_dir/$fixture-run.log" 2>&1; then
              echo "OpenVM unexpectedly accepted adversarial spend fixture: $fixture"
              cat "$fixture_dir/$fixture-run.log"
              exit 1
            fi
            grep -q "OpenVM rejected witness" "$fixture_dir/$fixture-run.log"
            echo "OpenVM rejected adversarial spend fixture: $fixture"
          done

      - name: Generate and verify application-level proofs with the pinned OpenVM SDK profile
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/v3-nullifier-witnesses"
          evidence_dir="$fixture_dir/evidence"
          mkdir -p "$evidence_dir"
          runner="proof-output-checker/target/release/openvm-v3-sdk-runner"
          elf="$(cat "$RUNNER_TEMP/v3-nullifier-guest-elf.path")"
          /usr/bin/time -f 'V3_SPIKE_SDK_RUNNER_SECONDS=%e MAX_RSS_KIB=%M' -o "$evidence_dir/sdk-runner.metrics" \
            "$runner" prove openvm.toml "$elf" "$fixture_dir" openvm/app.vk \
            expected-app-exe-commit.txt "$evidence_dir"
          stat --format='V3_SPIKE_APP_PROOF_BYTES=%s' "$fixture_dir/valid.app.proof"
          sha256sum "$fixture_dir/valid.app.proof"
          stat --format='V3_SPIKE_SPEND_PROOF_BYTES=%s' "$fixture_dir/spend-valid.app.proof"
          sha256sum "$fixture_dir/spend-valid.app.proof"
          checker="proof-output-checker/target/release/psp-openvm-v3-proof-output-checker"
          "$checker" openvm/app.vk "$fixture_dir/valid.app.proof" \
            expected-app-exe-commit.txt "$fixture_dir/expected-public-digest.txt"
          "$checker" openvm/app.vk "$fixture_dir/spend-valid.app.proof" \
            expected-app-exe-commit.txt "$fixture_dir/expected-spend-public-digest.txt"
          python3 scripts/openvm_ledger_integration.py \
            "$checker" openvm/app.vk "$fixture_dir/spend-valid.app.proof" \
            expected-app-exe-commit.txt "$fixture_dir/expected-spend-public-digest.txt"
          python3 scripts/verify_candidate_proof_adapter.py \
            "$checker" openvm/app.vk "$fixture_dir/spend-valid.app.proof" \
            expected-app-exe-commit.txt "$fixture_dir/expected-spend-public-digest.txt"
          cat "$evidence_dir/keygen.metrics" "$evidence_dir/app-prove.metrics" \
            "$evidence_dir/app-verify.metrics" "$evidence_dir/spend-prove.metrics" \
            "$evidence_dir/spend-verify.metrics"

      - name: End-to-end local spend through the authenticated TLS proof worker
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/v3-nullifier-witnesses"
          runner="proof-output-checker/target/release/openvm-v3-sdk-runner"
          checker="proof-output-checker/target/release/psp-openvm-v3-proof-output-checker"
          elf="$(cat "$RUNNER_TEMP/v3-nullifier-guest-elf.path")"
          cert="$RUNNER_TEMP/openvm-worker-test.crt"
          key="$RUNNER_TEMP/openvm-worker-test.key"
          ledger="$RUNNER_TEMP/openvm-worker-ledger.sqlite3"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$key" -out "$cert" -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          export OPENVM_RUNNER="$runner"
          export OPENVM_CONFIG="openvm.toml"
          export OPENVM_ELF="$elf"
          export WORKER_API_KEY="$(openssl rand -hex 32)"
          export WORKER_TLS_CERT="$cert"
          export WORKER_TLS_KEY="$key"
          export WORKER_BIND_HOST="127.0.0.1"
          export WORKER_PORT="8443"
          python3 "$GITHUB_WORKSPACE/src/protocol/v3_proof_worker.py" >/dev/null 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST --data-binary '' --cacert "$cert" \
              https://localhost:8443/v1/prove || true)"
            if [ "$status" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          python3 scripts/openvm_local_spend.py \
            --worker-url https://localhost:8443 \
            --ca-certificate "$cert" \
            --checker "$checker" \
            --app-vk openvm/app.vk \
            --app-commit expected-app-exe-commit.txt \
            --ledger "$ledger" \
            --allow-synthetic-bootstrap

      - name: Ensure guest build did not alter locked dependencies
        run: git diff --exit-code -- proof/openvm/v3-nullifier-spike/Cargo.lock

      - name: Record toolchain versions
        if: always()
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/v3-nullifier-witnesses/evidence"
          mkdir -p "$evidence_dir"
          {
            rustc +1.91.1 --version
            cargo +1.91.1 --version
            cargo +1.91.1 openvm --version || true
            riscv64-unknown-elf-gcc --version | sed -n '1p'
          } 2>&1 | tee "$evidence_dir/toolchain.txt"

      - name: Build non-secret proof evidence manifest
        if: success()
        env:
          CARGO_OPENVM_SHA256: c2a1d63a96c093a4969c799f3021fb991b0c51f56b53f26e3468d2d13676de2f
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          fixture_dir="$RUNNER_TEMP/v3-nullifier-witnesses"
          checker="$(find proof-output-checker/target/release -maxdepth 1 -type f -name 'psp-openvm-v3-proof-output-checker' -print -quit)"
          test -n "$checker"
          python3 scripts/write_v3_spike_evidence_manifest.py --fixture-dir "$fixture_dir" --checker "$checker"
          cat "$fixture_dir/evidence/manifest.json"

      - name: Upload non-secret proof evidence manifest
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 0psp-openvm-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v3-nullifier-witnesses/evidence/manifest.json
          if-no-files-found: error
          retention-days: 90

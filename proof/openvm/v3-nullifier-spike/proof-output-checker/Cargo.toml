[package]
name = "psp-openvm-v3-proof-output-checker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
openvm-sdk = { git = "https://github.com/openvm-org/openvm.git", rev = "59a69b8b0cbee7011ac978e4cc07707ee3681944", default-features = false }
openvm-continuations = { git = "https://github.com/openvm-org/openvm.git", rev = "59a69b8b0cbee7011ac978e4cc07707ee3681944", default-features = false }
openvm-sdk-config = { git = "https://github.com/openvm-org/openvm.git", rev = "59a69b8b0cbee7011ac978e4cc07707ee3681944", default-features = false }
openvm-stark-sdk = { git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.1", default-features = false }
openvm-stark-backend = { version = "2.0.1", git = "https://github.com/openvm-org/stark-backend.git", tag = "v2.0.1", default-features = false }
hex = "0.4"
eyre = "0.6"
serde_json = "1"
bitcode = { version = "0.6", default-features = false, features = ["serde", "std"] }
zeroize = "1.9"

[profile.release]
opt-level = 2
